<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Currency Converter — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Live Currency Converter</h1><div class="calc"><input id="amount" type="number" value="1000"><div class="row"><select id="from"><option>AED</option><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>PKR</option></select><select id="to"><option>PKR</option><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>AED</option></select></div><button class="btn2" onclick="run()">Convert Live</button><div id="result" class="result">—</div></div></div></div><script>async function run(){const r=await fetch(`https://api.frankfurter.dev/v2/rate/${from.value}/${to.value}`),j=await r.json();result.textContent=`${amount.value} ${from.value} = ${(Number(amount.value)*j.rate).toFixed(2)} ${to.value} (1 ${from.value} = ${j.rate})`}</script></body></html>
