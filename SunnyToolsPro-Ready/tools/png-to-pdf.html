<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNG to PDF — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>PNG to PDF</h1><label class="drop">🖼️<br><input id="files" type="file" accept="image/png" multiple></label><button class="btn2" onclick="run()">Create PDF</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>async function run(){const {jsPDF}=window.jspdf,pdf=new jsPDF();for(let i=0;i<files.files.length;i++){const f=files.files[i],d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}),im=new Image();im.src=d;await new Promise(r=>im.onload=r);if(i)pdf.addPage();const s=Math.min(190/im.width,277/im.height);pdf.addImage(d,"PNG",(210-im.width*s)/2,(297-im.height*s)/2,im.width*s,im.height*s)}pdf.save("png-images.pdf")}</script></body></html>
