<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word to PDF — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Word to PDF</h1><label class="drop">📘<br><input id="file" type="file" accept=".docx"></label><button class="btn2" onclick="run()">Convert</button><div id="out"></div></div></div><script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>async function run(){const f=file.files[0];if(!f)return;const h=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()}),text=h.value.replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ");const {jsPDF}=window.jspdf,p=new jsPDF();p.setFontSize(11);p.text(text,10,15,{maxWidth:190});p.save("converted.pdf");out.textContent="Converted. Complex Word layouts may not be preserved exactly."}</script></body></html>
