<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Image Compressor</h1><label class="drop">🖌️<br><input id="file" type="file" accept="image/*"></label><div class="row"><label>Quality <input id="q" type="range" min=".1" max="1" step=".05" value=".75"></label><button class="btn2" onclick="run()">Compress</button></div><p id="out"></p></div></div><script>async function run(){const f=file.files[0];if(!f)return alert("Choose image.");const im=new Image();im.src=URL.createObjectURL(f);await new Promise(r=>im.onload=r);const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="compressed.jpg";a.click();out.textContent=`Original ${(f.size/1024).toFixed(1)} KB → ${(b.size/1024).toFixed(1)} KB`},"image/jpeg",Number(q.value))}</script></body></html>
