<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAE VAT Calculator — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>UAE VAT Calculator</h1><div class="calc"><input id="amount" type="number" placeholder="Amount"><select id="mode"><option value="add">Add 5% VAT</option><option value="remove">Remove 5% VAT</option></select><button class="btn2" onclick="run()">Calculate</button><div id="result" class="result">—</div></div></div></div><script>function run(){const a=+amount.value||0;if(mode.value==="add")result.textContent=`VAT: AED ${(a*.05).toFixed(2)} | Total: AED ${(a*1.05).toFixed(2)}`;else result.textContent=`VAT included: AED ${(a-a/1.05).toFixed(2)} | Net: AED ${(a/1.05).toFixed(2)}`}</script></body></html>
