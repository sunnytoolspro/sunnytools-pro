<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Unit Converter</h1><div class="calc"><input id="v" type="number" placeholder="Value"><select id="unit"><option value="km-mi">Kilometers → Miles</option><option value="mi-km">Miles → Kilometers</option><option value="kg-lb">Kilograms → Pounds</option><option value="lb-kg">Pounds → Kilograms</option><option value="c-f">Celsius → Fahrenheit</option><option value="f-c">Fahrenheit → Celsius</option></select><button class="btn2" onclick="run()">Convert</button><div id="result" class="result">—</div></div></div></div><script>function run(){const x=+v.value||0,m={"km-mi":x*.621371,"mi-km":x/0.621371,"kg-lb":x*2.20462,"lb-kg":x/2.20462,"c-f":x*9/5+32,"f-c":(x-32)*5/9};result.textContent=m[unit.value].toFixed(4)}</script></body></html>
