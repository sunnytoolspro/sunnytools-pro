<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Split — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>PDF Split</h1><label class="drop">✂️<br><b>Choose PDF</b><br><input id="file" type="file" accept="application/pdf"></label><div class="row"><input id="pages" placeholder="Pages e.g. 1,3,5"><button class="btn2" onclick="run()">Split</button></div><p id="out"></p></div></div><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>async function run(){const f=file.files[0];if(!f)return alert("Choose PDF.");const nums=pages.value.split(",").map(x=>parseInt(x.trim())-1).filter(x=>x>=0);const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),out=await PDFLib.PDFDocument.create();const ps=await out.copyPages(src,nums.filter(x=>x<src.getPageCount()));ps.forEach(p=>out.addPage(p));const b=await out.save(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));a.download="split.pdf";a.click();}</script></body></html>
