<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Image Resizer</h1><label class="drop">↔️<br><input id="file" type="file" accept="image/*"></label><div class="row"><input id="w" type="number" placeholder="Width px"><input id="h" type="number" placeholder="Height px"><button class="btn2" onclick="run()">Resize</button></div></div></div><script>async function run(){const f=file.files[0],im=new Image();if(!f)return;im.src=URL.createObjectURL(f);await new Promise(r=>im.onload=r);const c=document.createElement("canvas");c.width=+w.value||im.width;c.height=+h.value||im.height;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resized.jpg";a.click()},"image/jpeg",.92)}</script></body></html>
