<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Word — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>PDF to Word</h1><label class="drop">📕<br><input id="file" type="file" accept="application/pdf"></label><button class="btn2" onclick="run()">Extract to DOCX</button><p id="out"></p></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script><script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";window.run=async()=>{const f=file.files[0],pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,paras=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();paras.push(c.items.map(x=>x.str).join(" "))}const {Document,Packer,Paragraph}=docx,d=new Document({sections:[{children:paras.map(x=>new Paragraph(x))}]});const b=await Packer.toBlob(d),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="extracted.docx";a.click();out.textContent="Text extracted to DOCX. Original PDF layout is not guaranteed."}</script></body></html>
