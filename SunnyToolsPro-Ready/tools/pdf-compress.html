<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compress — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>PDF Compress</h1><label class="drop">🗜️<br><b>Choose PDF</b><br><input id="file" type="file" accept="application/pdf"></label><button class="btn2" onclick="run()">Compress / Re-save</button><p>Note: true object-level compression depends on the PDF contents; this tool removes unused objects where possible.</p></div></div><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>async function run(){const f=file.files[0];if(!f)return alert("Choose PDF.");const d=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:false});const b=await d.save({useObjectStreams:true,addDefaultPage:false});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));a.download="compressed.pdf";a.click()}</script></body></html>
