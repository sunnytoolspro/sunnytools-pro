<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qibla Finder — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Qibla Finder</h1><div class="result" id="result">Calculating…</div><p>Uses your device location when permission is granted. Qibla bearing is calculated toward the Kaaba.</p></div></div><script>const K=[21.422487,39.826206];function calc(lat,lon){const r=Math.PI/180,φ1=lat*r,φ2=K[0]*r,dl=(K[1]-lon)*r,b=Math.atan2(Math.sin(dl),Math.cos(φ1)*Math.tan(φ2)-Math.sin(φ1)*Math.cos(dl))/r;return (b+360)%360}navigator.geolocation?.getCurrentPosition(p=>result.textContent=`Qibla direction: ${calc(p.coords.latitude,p.coords.longitude).toFixed(1)}° from true north`,e=>result.textContent="Location permission is required to calculate your local Qibla direction.")</script></body></html>
