<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Age Calculator</h1><div class="calc"><input id="dob" type="date"><button class="btn2" onclick="run()">Calculate Age</button><div id="result" class="result">—</div></div></div></div><script>function run(){const d=new Date(dob.value),n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();if(m<0||m===0&&n.getDate()<d.getDate())y--;result.textContent=`Age: ${y} years`}</script></body></html>
