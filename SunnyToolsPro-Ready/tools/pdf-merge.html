<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merge — SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a class="back" href="../">← SunnyToolsPro</a><div class="tool-card"><h1>PDF Merge</h1><label class="drop">📚<br><b>Choose PDF files</b><br><input id="files" type="file" accept="application/pdf" multiple></label><button class="btn2" onclick="run()">Merge PDFs</button><p id="out"></p></div></div><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>async function run(){if(!files.files.length)return alert("Choose PDFs.");const out=await PDFLib.PDFDocument.create();for(const f of files.files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}const b=await out.save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));a.download="merged.pdf";a.click();out.textContent="Merged successfully."}</script></body></html>
