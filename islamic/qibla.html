<!doctype html><html><head><meta charset="utf-8"><title>Qibla Finder</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><div class="tool-card"><h1>🕋 Qibla Finder</h1><div id="r" class="result">Requesting location…</div></div></div><script>function q(lat,lon){let R=Math.PI/180,p=lat*R,k=21.422487*R,d=(39.826206-lon)*R,b=Math.atan2(Math.sin(d),Math.cos(p)*Math.tan(k)-Math.sin(p)*Math.cos(d))/R;return(b+360)%360}navigator.geolocation.getCurrentPosition(p=>r.textContent=`Qibla: ${q(p.coords.latitude,p.coords.longitude).toFixed(1)}° true north`,()=>r.textContent='Location permission required')</script></body></html>
