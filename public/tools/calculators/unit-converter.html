<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter — SunnyToolsPro</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><a class="brand" href="/">☀ SUNNYTOOLS PRO</a><div class="navlinks"><a href="/tools/">All Tools</a><a href="/uae/">🇦🇪 UAE</a><a href="/islamic/">🌙 Islamic</a></div></nav><main class="toolbox"><span class="pill">CALCULATORS</span><h1>Unit Converter</h1><div class="inputs"><input id="v" type="number" value="1"><select id="u"><option value="km">km → miles</option><option value="mi">miles → km</option><option value="kg">kg → lb</option><option value="lb">lb → kg</option><option value="c">°C → °F</option><option value="f">°F → °C</option></select><button class="primary" onclick="go()">Convert</button></div><div id="r" class="result">—</div></main><script>function go(){let x=+v.value,m={km:x*.621371,mi:x/0.621371,kg:x*2.20462,lb:x/2.20462,c:x*9/5+32,f:(x-32)*5/9};r.textContent=m[u.value].toFixed(4)}</script></body></html>
