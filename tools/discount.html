<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Calculator - SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Discount Calculator</h1><input id="a" type="number" placeholder="Original price"><input id="b" type="number" placeholder="Discount %"><button onclick="go()">Calculate</button><div id="r" class="result"></div></div></div><script>function go(){let x=+a.value||0,d=+b.value||0;r.textContent=`Discount: ${(x*d/100).toFixed(2)} | Final: ${(x*(1-d/100)).toFixed(2)}`}</script></body></html>
