<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter - SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Word Counter</h1><textarea id="t" rows="12" style="width:100%"></textarea><div id="r" class="result">0 words</div></div></div><script>t.oninput=()=>{let x=t.value.trim();r.textContent=`${x?x.split(/\s+/).length:0} words • ${t.value.length} characters`}</script></body></html>
