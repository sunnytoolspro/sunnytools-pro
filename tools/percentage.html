<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator - SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a href="../">← SunnyToolsPro</a><div class="tool-card"><h1>Percentage Calculator</h1><input id="a" type="number" placeholder="Value"><input id="b" type="number" placeholder="Percent"><button onclick="go()">Calculate</button><div id="r" class="result"></div></div></div><script>function go(){r.textContent=((+a.value||0)*(+b.value||0)/100).toFixed(2)}</script></body></html>
