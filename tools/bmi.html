<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator - SunnyToolsPro</title><link rel="stylesheet" href="../tool.css"></head><body><div class="tool-wrap"><a href="../">← SunnyToolsPro</a><div class="tool-card"><h1>BMI Calculator</h1><input id="w" type="number" placeholder="Weight kg"><input id="h" type="number" placeholder="Height cm"><button onclick="go()">Calculate</button><div id="r" class="result"></div></div></div><script>function go(){let x=+w.value||0,y=(+h.value||0)/100;r.textContent=y?`BMI: ${(x/(y*y)).toFixed(1)}`:"Enter height"}</script></body></html>
